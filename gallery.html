<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galleria | RS-Expert Oy</title>
  <meta name="description" content="Galleria tehdyistä töistä - RS-Expert Oy">
  
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

  <!-- Навигация (скопируй из index.html или сделай отдельный header) -->
  <header>
    <!-- вставь сюда свою шапку -->
  </header>

  <main class="container">
    <h1>Galleria</h1>
    <p class="text-center mb-8">Viimeisimmät työt Instagramista (@rs.expert)</p>

    <div id="instagram-gallery" class="gallery-grid">
      <!-- Фото будут загружаться через JavaScript -->
      <p class="loading text-center">Ladataan kuvia...</p>
    </div>
  </main>

  <footer>
    <!-- твой футер -->
  </footer>

  <script>
    async function loadInstagramGallery() {
      const container = document.getElementById('instagram-gallery');
      
      try {
        const response = await fetch('data/instagram.json');
        if (!response.ok) throw new Error('JSON not found');
        
        const data = await response.json();
        
        if (!data.items || data.items.length === 0) {
          container.innerHTML = `<p class="text-center">Kuvia ei löytynyt. Yritä myöhemmin uudelleen.</p>`;
          return;
        }

        let html = '';
        data.items.forEach(item => {
          html += `
            <div class="gallery-item">
              <a href="${item.url}" target="_blank" rel="noopener noreferrer">
                <img src="${item.image}" alt="${item.alt}" loading="lazy">
              </a>
            </div>
          `;
        });

        container.innerHTML = html;

      } catch (error) {
        console.error(error);
        container.innerHTML = `
          <p class="text-center text-red-600">
            Virhe kuvien lataamisessa. Sivusto päivittää gallerian automaattisesti joka päivä.
          </p>`;
      }
    }

    // Запускаем при загрузке страницы
    window.onload = loadInstagramGallery;
  </script>

</body>
</html>
