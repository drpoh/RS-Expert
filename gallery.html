<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galleria | RS-Expert Oy</title>
  <meta name="description" content="Galleria tehdyistä töistä — RS-Expert Oy">
  
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

  <!-- Header (скопируй из index.html) -->
  <header id="site-header">
    <!-- вставь сюда свой header -->
  </header>

  <main class="container">
    <div class="section">
      <h1>Galleria</h1>
      <p class="lead">Viimeisimmät työt ja referenssit Instagramista (@rs.expert)</p>
      
      <div id="instagram-gallery" class="iggrid">
        <!-- Галерея загружается через JS -->
        <div class="loading text-center" style="grid-column: 1 / -1; padding: 40px 0;">
          Ladataan kuvia Instagramista...
        </div>
      </div>
    </div>
  </main>

  <footer id="site-footer">
    <!-- твой footer -->
  </footer>

  <script>
    async function loadInstagramGallery() {
      const container = document.getElementById('instagram-gallery');
      
      try {
        const response = await fetch('data/instagram.json');
        if (!response.ok) throw new Error('Failed to load instagram.json');
        
        const data = await response.json();
        
        if (!data.items || data.items.length === 0) {
          container.innerHTML = `<p class="text-center" style="grid-column: 1 / -1;">Kuvia ei ole vielä saatavilla.</p>`;
          return;
        }

        let html = '';
        data.items.forEach(item => {
          html += `
            <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="igthumb hover-lift">
              <img src="${item.image}" alt="${item.alt}" class="igthumb__img" loading="lazy">
            </a>
          `;
        });

        container.innerHTML = html;

      } catch (error) {
        console.error(error);
        container.innerHTML = `
          <p class="text-center" style="grid-column: 1 / -1; color: var(--muted);">
            Virhe gallerian lataamisessa.<br>
            Sivusto päivittää kuvat automaattisesti joka päivä.
          </p>`;
      }
    }

    // Запуск после загрузки страницы
    window.addEventListener('load', loadInstagramGallery);
  </script>
</body>
</html>
