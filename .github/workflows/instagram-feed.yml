name: Update Instagram previews

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

concurrency:
  group: instagram-previews
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Instaloader
        run: |
          python -m pip install --upgrade pip
          pip install instaloader

      - name: Remove old Instagram cache
        run: |
          rm -rf assets/ig
          mkdir -p assets/ig

      - name: Download latest Instagram posts
        env:
          IG_PROFILE: rs.expert
        run: |
          instaloader \
            --no-metadata-json \
            --no-compress-json \
            --dirname-pattern "assets/ig/${IG_PROFILE}" \
            --filename-pattern "{date_utc}_UTC_{shortcode}" \
            --quiet \
            --count 40 \
            profile "${IG_PROFILE}" || true

      - name: Build instagram.json
        env:
          IG_PROFILE: rs.expert
          MAX_ITEMS: "40"
        run: |
          python scripts/build_instagram.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add assets/ig
          git add data/instagram.json

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Update Instagram previews"

      - name: Pull latest changes
        run: |
          git pull --rebase origin main

      - name: Push changes
        run: |
          git push origin main
